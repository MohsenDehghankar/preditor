# Copy this file to your USER SITE repo as:
#   .github/workflows/deploy-pages.yml
#
# It checks out the preditor submodule, builds it, and publishes:
#   /           → your existing site files (everything except preditor/, .git, .github)
#   /preditor/  → Vite build output (so /preditor/index.html works)
#
# GitHub: Settings → Pages → Source = GitHub Actions

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: preditor/package-lock.json

      - name: Build preditor (Vite)
        run: |
          cd preditor
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude preditor --exclude .git --exclude .github ./ _site/
          mkdir -p _site/preditor
          rsync -a preditor/dist/ _site/preditor/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
